name: Günlük Hisse Temel Veri Çekici

on:
  schedule:
    # Türkiye saati ile her gün 19:00 = UTC 16:00
    - cron: '0 16 * * *'
  workflow_dispatch:   # manuel çalıştırma için

jobs:
  veri-cek:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # repoya push yapabilmek için gerekli

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli kütüphaneleri yükle
        run: |
          pip install --upgrade pip
          pip install yfinance pandas openpyxl

      - name: Hisse listesi dosyasını kontrol et
        run: |
          if [ ! -f "hisseisimleri.txt" ]; then
            echo "Hata: hisseisimleri.txt dosyası bulunamadı!"
            exit 1
          fi
          echo "Hisse listesi dosyası mevcut."

      - name: Python betiğini çalıştır
        run: python TemelVerileriCek.py   # Betik dosyanızın adı bu (düzeltin gerekirse)

      - name: Archive klasörünü oluştur ve Excel dosyasını taşı
        run: |
          mkdir -p Archive
          # Betiğin ürettiği dosya adı örn: hisse_temel_veriler_21_03_2025.xlsx
          mv hisse_temel_veriler_*.xlsx Archive/

      - name: Değişiklikleri commit et ve pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Archive/
          git commit -m "Günlük hisse verileri eklendi: $(date +'%d.%m.%Y')" || echo "Değişiklik yok"
          git push