name: Günlük Hisse Temel Veri Çekici

on:
  schedule:
    # Türkiye saati ile her gün 19:00 = UTC 16:00
    - cron: '0 16 * * *'
  workflow_dispatch:   # manuel çalıştırma için

jobs:
  veri-cek:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli kütüphaneleri yükle
        run: |
          pip install --upgrade pip
          pip install yfinance pandas openpyxl requests

      - name: Hisse listesi dosyasını kontrol et
        run: |
          if [ ! -f "hisseisimleri.txt" ]; then
            echo "Hata: hisseisimleri.txt dosyası bulunamadı!"
            exit 1
          fi
          echo "Hisse listesi dosyası mevcut."

      - name: Python betiğini çalıştır
        run: python TemelVerileriCek.py

      - name: Üretilen Excel dosyasını artefact olarak yayınla
        uses: actions/upload-artifact@v4
        with:
          name: hisse_temel_veriler_$(date +'%d_%m_%Y')
          path: temel_veriler_*.xlsx