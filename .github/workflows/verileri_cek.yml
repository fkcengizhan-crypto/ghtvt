name: Günlük Hisse Temel Veri Çekici

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  veri-cek:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli kütüphaneleri yükle
        run: |
          pip install --upgrade pip
          pip install yfinance pandas openpyxl

      - name: Hisse listesi dosyasını kontrol et
        run: |
          if [ ! -f "hisseisimleri.txt" ]; then
            echo "Hata: hisseisimleri.txt dosyası bulunamadı!"
            exit 1
          fi
          echo "Hisse listesi dosyası mevcut."

      - name: Python betiğini çalıştır
        run: python TemelVerileriCek.py

      - name: Archive klasörünü oluştur ve sadece tarihli dosyayı taşı
        run: |
          mkdir -p Archive
          # Tarihli dosyayı taşı (örnek: hisse_temel_veriler_21_03_2025.xlsx)
          # Sabit dosya (hisse_temel_veriler.xlsx) ana dizinde kalır
          mv hisse_temel_veriler_*.xlsx Archive/ 2>/dev/null || true

      - name: Değişiklikleri commit et ve pushla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Archive/ hisse_temel_veriler.xlsx hisse_temel_veriler.json
          git commit -m "Günlük hisse verileri eklendi: $(date +'%d.%m.%Y')" || echo "Değişiklik yok"
          git push
